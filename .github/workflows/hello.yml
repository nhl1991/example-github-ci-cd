name: Hello                       # 워크플로명
on: push                          # 이벤트(푸시할 때 실행) on: [push, pull_request] 처럼 배열도 가능
jobs:                             # 작업 정의       
  hello:                          # 작업 ID
    runs-on: ubuntu-latest        # 러너(우분투에서 실행)
    steps:                        # 단계 정의
      - run: echo "Hello, world!" # 셀 명령 실행
      - uses: actions/checkout@v4 # 액션 호출
      - run: |
          git log -1
          tree -a
      - uses: actions/checkout@v4
        with:
          ref: main