name: Manual
on: 
  workflow_dispatch:
    inputs:
      greeting:
        type: string
        default: Hello
        required: true
        description: A Cheerful word
      log-level:
        type: choice
        options:
          - debug
          - info
          - warning
          - error
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - run: echo "${{ inputs.greeting }}"
    - run: echo "${{ inputs.log-level }}"